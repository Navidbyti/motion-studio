<!doctype html>
<html lang="en" data-ratio="9:16">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="./house.css" />
    <link rel="stylesheet" href="./brand.css" />
    <script src="./vendor/gsap.min.js"></script>
    <script src="./timing.js"></script>
    <script src="./data.js"></script>
    <script src="./reframe.js"></script>
    <script src="./studio.js"></script>
    <style>
      [data-composition-id="main"] > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <!-- scenes: one sub-composition slot per beat-map scene; `mstudio beatmap <slug> apply` creates and times them -->
      <div id="slot-s1" data-scene="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="4" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="slot-s2" data-scene="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="4" data-duration="4" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="slot-s3" data-scene="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="8" data-duration="8" data-track-index="1" data-width="1080" data-height="1920"></div>
      <!-- /scenes -->
      <!-- media: footage (<video data-media="…" muted>) and audio (<audio id="…">) live here, never inside a scene -->
      <audio id="music" data-timeline-role="music" src="audio/music.wav" data-start="0" data-media-start="0" data-duration="16" data-track-index="10" data-volume="1"></audio>
      <!-- /media -->
    </div>
    <script>
      // Host timeline: footage reframing and anything that must span scenes. Scene motion lives in compositions/<scene>.html.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
